name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
  issue_comment:
    types: [created]

jobs:
  review:
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
       startsWith(github.event.comment.body, '@claude review') &&
       github.event.comment.author_association == 'OWNER')
    runs-on: ubuntu-latest
    # Job-level so skipped runs (e.g. Claude's own review comment) don't cancel an active review.
    concurrency:
      group: claude-review-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'issue_comment' && format('refs/pull/{0}/head', github.event.issue.number) || '' }}

      # Read the rules from the default branch, so PRs branched before they existed
      # still get them, and a PR can't rewrite its own review rules.
      - id: rules
        run: |
          {
            echo 'text<<RULES_EOF'
            git show "origin/${{ github.event.repository.default_branch }}:.github/claude/code-reviewer.md"
            echo 'RULES_EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}

            Review this pull request following the reviewer instructions below
            (ignore their frontmatter).
            Get the PR with `gh pr view` and `gh pr diff`.
            You are asked to post: when done, post the report as ONE PR comment with
            `gh pr comment ${{ github.event.pull_request.number || github.event.issue.number }} --body-file <file>`.
            Never approve, request changes or merge.

            <reviewer-instructions>
            ${{ steps.rules.outputs.text }}
            </reviewer-instructions>
          claude_args: |
            --allowedTools "Read,Grep,Glob,Write,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh issue view:*),Bash(git log:*),Bash(git diff:*),Bash(git show:*)"
